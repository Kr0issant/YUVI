[project]
name = "yuvi"
version = "0.1.0"
description = "Utility and Ticket Management Discord Bot for Reinforce Club SST"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "fastapi>=0.115.0",
    "firebase-admin>=7.6.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

